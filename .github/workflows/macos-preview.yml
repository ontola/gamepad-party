name: macOS installer
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      version:
        type: string
        required: true
      automatic:
        type: boolean
        default: false
    secrets:
      MACOS_CERTIFICATE_P12:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER_ID:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Numeric macOS bundle version'
        required: true
        default: '0.1.4'
      binaries_run:
        description: 'Optional previous run with successful native builds (packaging-only changes)'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: macos-installer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # One job on one macOS runner: builds both architectures, then packages.
  # Separate build and package jobs each had to wait for a macOS runner, and
  # a package job that got none within 15 min was cancelled (0.2.563).
  package:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.binaries_run == ''
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      # The lobby is the Warp Game Room, built from the Warp repository;
      # ontola/warp-game-engine is public: no token needed.
      - name: Check out the Warp engine for the Game Room lobby
        if: inputs.binaries_run == ''
        uses: actions/checkout@v4
        with:
          repository: ontola/warp-game-engine
          path: warp
      - uses: Swatinem/rust-cache@v2
        if: inputs.binaries_run == ''
        with:
          workspaces: |
            . -> target
            warp -> target
          key: macos-installer
      - name: Build the host and the Warp Game Room for both architectures
        if: inputs.binaries_run == ''
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            CARGO_TARGET_DIR="$PWD/target" cargo build --locked --release --target $target -p gamenight-daemon
            cargo build --locked --release --manifest-path warp/Cargo.toml --target $target -p game-room
            mkdir -p binaries/binaries-$target
            cp target/$target/release/gamenight-launcher target/$target/release/gamenight-daemon \
               warp/target/$target/release/game-room binaries/binaries-$target/
          done
      - uses: actions/upload-artifact@v4
        if: inputs.binaries_run == ''
        with:
          name: binaries-aarch64-apple-darwin
          path: binaries/binaries-aarch64-apple-darwin/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.binaries_run == ''
        with:
          name: binaries-x86_64-apple-darwin
          path: binaries/binaries-x86_64-apple-darwin/*
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        if: inputs.binaries_run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.binaries_run }}
          pattern: binaries-*
          path: binaries
      - uses: actions/download-artifact@v4
        if: inputs.automatic
        with:
          name: release-catalog
          path: catalog/games
      - name: Import Developer ID certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::warning::MACOS_CERTIFICATE_P12 is not set; the app is signed ad hoc and Gatekeeper will block it on other Macs."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$identity" ]; then echo "::error::No Developer ID Application identity in MACOS_CERTIFICATE_P12"; exit 1; fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Assemble universal app with current assets
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          VERSION: ${{ inputs.version }}
          SOURCE_REVISION: ${{ inputs.ref }}
          BINARY_RUN: ${{ inputs.binaries_run || github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p universal stage release
          for name in gamenight-launcher gamenight-daemon game-room; do
            lipo -create binaries/binaries-aarch64-apple-darwin/$name binaries/binaries-x86_64-apple-darwin/$name -output universal/$name
            lipo universal/$name -verify_arch arm64 x86_64
          done
          binary_revision=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BINARY_RUN" --jq .head_sha)
          if [ -n "$SOURCE_REVISION" ]; then binary_revision="$SOURCE_REVISION"; fi
          python3 scripts/package-macos.py --binaries universal --game-room universal/game-room --output stage --version "$VERSION" --binary-revision "$binary_revision" --sign-identity "$SIGN_IDENTITY"
          python3 scripts/test-macos-package.py stage/GameNight.app
      - name: Launch packaged host outside source directory
        run: |
          python3 scripts/smoke-macos-package.py stage/GameNight.app --output smoke
      - name: Create disk image
        run: |
          mkdir dmg-root
          ditto stage/GameNight.app dmg-root/GameNight.app
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname GameNight -srcfolder dmg-root -ov -format UDZO release/GameNight.dmg
          hdiutil verify release/GameNight.dmg
      - name: Sign and notarize disk image
        if: steps.signing.outputs.identity != '-'
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$API_KEY_P8" ] || [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ]; then
            echo "::error::Signing is configured but APPLE_API_KEY_P8, APPLE_API_KEY_ID or APPLE_API_ISSUER_ID is missing"; exit 1
          fi
          codesign --force --sign "$SIGN_IDENTITY" --timestamp release/GameNight.dmg
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$API_KEY_P8" > "$key"
          if ! grep -q "BEGIN PRIVATE KEY" "$key"; then printf '%s' "$API_KEY_P8" | base64 --decode > "$key"; fi
          xcrun notarytool submit release/GameNight.dmg --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --wait --timeout 30m --output-format json | tee notarization.json
          status=$(python3 -c "import json; print(json.load(open('notarization.json'))['status'])")
          if [ "$status" != "Accepted" ]; then
            id=$(python3 -c "import json; print(json.load(open('notarization.json'))['id'])")
            xcrun notarytool log "$id" --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
            exit 1
          fi
          rm "$key"
          xcrun stapler staple release/GameNight.dmg
          xcrun stapler validate release/GameNight.dmg
          spctl --assess --type open --context context:primary-signature --verbose release/GameNight.dmg
      - name: Checksum disk image
        run: |
          cd release
          shasum -a 256 GameNight.dmg > GameNight.dmg.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gamenight-macos-installer
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gamenight-macos-smoke
          path: smoke/
          if-no-files-found: ignore
